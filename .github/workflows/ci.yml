name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, PHP ${{ matrix.php }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.4'
            extensions: pcntl
          - os: ubuntu-latest
            php: '8.5'
            extensions: pcntl
          - os: windows-latest
            php: '8.5'
            extensions: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: '${{ matrix.extensions }}'
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer audit --no-interaction
      - run: composer check
      - run: composer stress

  consumer:
    name: Production consumer with DI 6 (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.6']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '${{ matrix.php }}'
          coverage: none
          tools: composer:v2
      # DI 6 is not released yet. The source snapshot is only a consumer
      # verification dependency; Identity's Composer manifest is unaffected.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: componenta/di
          ref: 2361c398fc938108de67df8ec6a723bf4c4648ff
          path: .ci/di6
          persist-credentials: false
      - name: Install isolated production consumer
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(mktemp -d "$RUNNER_TEMP/identity-consumer.XXXXXX")"
          trap 'rm -rf "$workspace"' EXIT
          mkdir "$workspace/identity" "$workspace/di" "$workspace/consumer"
          git archive HEAD | tar -x -C "$workspace/identity"
          git -C .ci/di6 rev-parse HEAD
          git -C .ci/di6 archive HEAD | tar -x -C "$workspace/di"
          cat > "$workspace/consumer/composer.json" <<'JSON'
          {
            "require": {
              "componenta/identity": "dev-main",
              "componenta/di": "^6.0@dev"
            },
            "repositories": {
              "identity": {
                "type": "path",
                "url": "../identity",
                "options": {"symlink": false, "versions": {"componenta/identity": "dev-main"}}
              },
              "di6": {
                "type": "path",
                "url": "../di",
                "options": {"symlink": false, "versions": {"componenta/di": "6.0.x-dev"}}
              }
            },
            "minimum-stability": "stable",
            "prefer-stable": true
          }
          JSON
          composer update --working-dir="$workspace/consumer" --no-dev --prefer-lowest --prefer-stable --no-interaction --prefer-dist
          composer audit --working-dir="$workspace/consumer" --no-dev --no-interaction
          php tests/consumer-smoke.php "$workspace/consumer/vendor/autoload.php"
